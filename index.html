<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QLABS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #0b1020; color: #eef2ff; }
    main { width: min(720px, 100%); padding: 56px 42px; border: 1px solid #27345b; border-radius: 24px; background: linear-gradient(145deg, #121a33, #0e1428); box-shadow: 0 24px 80px #0006; }
    .mark { color: #8ea7ff; letter-spacing: .22em; font-size: .8rem; font-weight: 700; }
    h1 { margin: 18px 0 12px; font-size: clamp(3.4rem, 13vw, 7rem); line-height: .9; letter-spacing: -.07em; }
    p { max-width: 540px; color: #b9c4e8; font-size: 1.1rem; line-height: 1.7; }
    .badge { display: inline-block; margin-top: 24px; padding: 9px 14px; border-radius: 999px; background: #1d2a52; color: #b9c9ff; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">QLABS</div>
    <h1>Ideas into experiments.</h1>
    <p>QLABS is a space for digital experiments, tools, and projects. The full site is coming soon.</p>
    <span class="badge">Building in public</span>
  </main>
</body>
</html>
